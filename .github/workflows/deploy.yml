name: Deploy to Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  packages: write

jobs:
  commit-hash:
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.get_commit.outputs.commit_hash }}
    steps:
      - uses: actions/checkout@v4
      - name: Get commit hash
        id: get_commit
        run: echo "commit_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.12"
      - name: Install Go dependencies
        run: go mod download
      - name: Run Go tests
        run: go test ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile
      - name: Build ReScript
        run: cd web && bun run rescript:build
      - name: Run web unit tests
        run: cd web && bun test --run
      - name: Install Playwright browsers
        run: cd web && bunx playwright install --with-deps chromium
      - name: Run web E2E tests
        run: cd web && bun run test:e2e
      - name: Build WASM
        run: ./scripts/build-wasm.sh
      - name: Build web
        run: cd web && bun run build

  build-and-push-image:
    needs:
      - build-and-test
      - commit-hash
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: |
            ghcr.io/naufaldi/go-pixo:${{ needs.commit-hash.outputs.commit_hash }}
            ghcr.io/naufaldi/go-pixo:prod

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build-and-push-image
      - commit-hash
    steps:
      - name: Validate deployment secrets
        id: validate-secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "Validating required deployment secrets..."

          REQUIRED_SECRETS=("VPS_HOST" "VPS_USERNAME" "SSH_PRIVATE_KEY")
          MISSING_SECRETS=()

          for secret in "${REQUIRED_SECRETS[@]}"; do
            if [ -z "${!secret}" ]; then
              MISSING_SECRETS+=("$secret")
            fi
          done

          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "Missing required secrets for deployment:"
            printf '   - %s\n' "${MISSING_SECRETS[@]}"
            exit 1
          fi

          echo "All required deployment secrets are present"
          echo "can_deploy=true" >> $GITHUB_OUTPUT

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 300s
          command_timeout: 10m
          script: |
            set -e
            
            echo "🚀 Starting deployment to VPS..."
            echo "Target: ${{ secrets.VPS_HOST }}"
            echo "User: ${{ secrets.VPS_USERNAME }}"
            echo "Image tag: ${{ needs.commit-hash.outputs.commit_hash }}"
            echo ""
            
            # Create deployment directory
            echo "📁 Creating deployment directory..."
            mkdir -p ~/go-pixo
            cd ~/go-pixo
            
            # Authenticate with container registry
            echo "🔐 Authenticating with GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            # Pull the latest image
            echo "📦 Pulling latest image..."
            docker pull ghcr.io/naufaldi/go-pixo:${{ needs.commit-hash.outputs.commit_hash }}
            docker pull ghcr.io/naufaldi/go-pixo:prod

            echo "Stopping legacy manual deployment..."
            docker rm -f go-pixo-app 2>/dev/null || true
            if [ -f docker-compose.yml ]; then
              docker compose -f docker-compose.yml down 2>/dev/null || true
            fi

            # Create docker-compose configuration
            echo "⚙️ Creating docker-compose configuration..."
            cat > docker-compose.prod.yml << 'EOL'
            version: '3.8'
            
            services:
              app:
                image: ghcr.io/naufaldi/go-pixo:${{ needs.commit-hash.outputs.commit_hash }}
                container_name: go-pixo-app
                labels:
                  - "caddy=go-pixo.faldi.xyz"
                  - "caddy.reverse_proxy={{upstreams 3000}}"
                restart: always
                networks:
                  - edge
                healthcheck:
                  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 40s
            
            networks:
              edge:
                external: true
            EOL
            
            # Stop existing containers
            echo "🛑 Stopping existing containers..."
            docker compose -f docker-compose.prod.yml down || true
            
            # Start new containers
            echo "▶️ Starting new containers..."
            docker compose -f docker-compose.prod.yml up -d
            
            # Wait for containers to be healthy
            echo "⏳ Waiting for containers to be ready..."
            sleep 30
            
            # Check running containers
            echo "📊 Checking running containers..."
            docker ps | grep go-pixo
            
            # Show container logs
            echo "📋 Recent container logs:"
            docker compose -f docker-compose.prod.yml logs --tail=20
            
            # Clean up unused images and containers
            echo "🧹 Cleaning up unused Docker resources..."
            docker image prune -f
            docker container prune -f
            
            echo "✅ Deployment completed successfully!"
            echo "🌐 Application should be available at: http://go-pixo.faldi.xyz"
            echo ""
            echo "Commit: ${{ needs.commit-hash.outputs.commit_hash }}"
            echo "Deployed at: $(date -u)"
            
      - name: Log deployment result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployment completed successfully!"
          else
            echo "Deployment failed. Check the logs above for details."
            echo "Common issues:"
            echo "  - SSH key authentication failed"
            echo "  - Docker registry access denied"
            echo "  - Server resources insufficient"
            echo "  - Network connectivity issues"
          fi
