name: Deploy to Server

on:
  push:
    branches:
      - main
      - master

permissions:
  packages: write

jobs:
  commit-hash:
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.get_commit.outputs.commit_hash }}
    steps:
      - uses: actions/checkout@v4
      - name: Get commit hash
        id: get_commit
        run: echo "commit_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install Go dependencies
        run: go mod download
      - name: Build WASM
        run: GOOS=js GOARCH=wasm go build -o web/public/main.wasm ./src/cmd/wasm
      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile
      - name: Type check
        run: cd web && bun run rescript:build
      - name: Build web
        run: cd web && bun run build

  build-and-push-image:
    needs:
      - build-and-test
      - commit-hash
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: |
            ghcr.io/mac/go-pixo:${{ needs.commit-hash.outputs.commit_hash }}
            ghcr.io/mac/go-pixo:prod

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build-and-push-image
      - commit-hash
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "Starting deployment..."

            mkdir -p ~/go-pixo
            cd ~/go-pixo

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            docker pull ghcr.io/mac/go-pixo:prod

            cat > docker-compose.prod.yml << 'EOL'
            version: '3.8'

            services:
              app:
                image: ghcr.io/mac/go-pixo:prod
                labels:
                  - "caddy=go-pixo.faldi.xyz"
                  - "caddy.reverse_proxy={{upstreams 3000}}"
                  - "com.centurylinklabs.watchtower.enable=true"
                restart: always
                networks:
                  - edge
                  - personal-web-private

            networks:
              edge:
                external: true
              personal-web-private:
                driver: bridge
            EOL

            docker compose -f docker-compose.prod.yml down || true
            docker compose -f docker-compose.prod.yml up -d

            echo "Checking running containers..."
            docker ps | grep go-pixo || true

            docker image prune -f
            docker container prune -f
