name: Verify image compression

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Verify package installation and the actual Linux image without publishing.
      - run: docker build --progress=plain -t go-pixo:verify .

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: go test ./...
      - name: Test WASM argument boundaries in Node
        run: GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./src/wasm -run 'Test(Handlers|RecompressHandlers)'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build:wasm
      - run: bun run build
      - run: bun run test
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: bunx playwright test --config playwright.offline.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            web/playwright-report/
            web/test-results/
            web/test-results-offline/
          retention-days: 7
