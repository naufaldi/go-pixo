name: Verify image compression

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: go test ./...
      - name: Test WASM argument boundaries in Node
        run: GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./src/wasm -run 'Test(Handlers|RecompressHandlers)'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      # The WASM bridge only builds under js/wasm, so lint that target too.
      - name: Lint js/wasm target
        run: GOOS=js GOARCH=wasm golangci-lint run ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build:wasm
      - run: bun run build
      - run: bun run test
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: bunx playwright test --config playwright.offline.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            web/playwright-report/
            web/test-results/
            web/test-results-offline/
          retention-days: 7

  # Diagnostic only: timings never fail this job (see docs/benchmarks/e2e-baseline.md).
  # It fails only when the runner itself exits non-zero, i.e. every iteration failed.
  benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # Match a local checkout: compiled ReScript exists before the dev server starts.
      - run: bun run rescript:build
      - run: bunx playwright install --with-deps chromium
      - name: Run E2E benchmark
        shell: bash
        run: |
          mkdir -p benchmark-report
          {
            echo "commit: ${GITHUB_SHA}"
            echo "runner: ${RUNNER_OS} ${RUNNER_ARCH} $(nproc) vCPU"
            echo "cpu: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
            echo "node: $(node --version) bun: $(bun --version) go: $(go version | cut -d' ' -f3)"
          } > benchmark-report/environment.txt
          bun run benchmark:e2e 2>&1 | tee benchmark-report/report.txt
      - name: Add report to job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## E2E benchmark (artifact-only, not a gate)'
            echo '```'
            cat benchmark-report/environment.txt
            echo
            sed -n '/Step Breakdown/,/^Config:/p' benchmark-report/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-benchmark-report
          path: web/benchmark-report/
          retention-days: 30
