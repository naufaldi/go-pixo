version: "3.8"

services:
  app:
    image: ghcr.io/naufaldi/go-pixo:prod
    labels:
      - "caddy=go-pixo.naufaldi.com"
      - "caddy.reverse_proxy={{upstreams 3000}}"
      - "com.centurylinklabs.watchtower.enable=true"
    restart: always
    networks:
      - edge

networks:
  edge:
    external: true
