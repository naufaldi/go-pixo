version: "2"
run:
  modules-download-mode: readonly
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errname
    - goconst
    - gocritic
    - govet
    - ineffassign
    - misspell
    - nilnil
    - noctx
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    govet:
      disable:
        - fieldalignment
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          severity: warning
        - name: package-comments
          severity: warning
        - name: blank-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
  exclusions:
    generated: lax
    rules:
      - linters:
          - goconst
          - gocritic
          - revive
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
      # npm packages can ship Go sources (e.g. flatted); they are not ours.
      - web/node_modules
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/mac/go-pixo
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      # npm packages can ship Go sources (e.g. flatted); they are not ours.
      - web/node_modules
